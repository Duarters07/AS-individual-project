receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  # Enriches every span/metric with host and OS info
  resourcedetection:
    detectors: [env, system]
    system:
      hostname_sources: [os]

  # Removes PII from span attributes before any export.
  # Centralised here so instrumentation code never needs to
  # remember which fields to exclude.
  transform/sanitize_pii:
    error_mode: ignore
    trace_statements:
      - context: span
        statements:
          # Payment / financial data
          - delete_key(attributes, "credit_card.number")
          - delete_key(attributes, "credit_card.cvv")
          - delete_key(attributes, "credit_card.expiry")
          # Customer identity
          - delete_key(attributes, "customer.email")
          - delete_key(attributes, "customer.username")
          - delete_key(attributes, "customer.phone")
          # Addresses
          - delete_key(attributes, "billing.address")
          - delete_key(attributes, "shipping.address")
          - delete_key(attributes, "billing.city")
          - delete_key(attributes, "shipping.city")
          # Strip token= query parameters from URLs
          - replace_pattern(attributes["url.query"], "token=[^&]*", "token=REDACTED")
          - replace_pattern(attributes["http.url"], "token=[^&]*", "token=REDACTED")

  batch:
    timeout: 5s
    send_batch_size: 512

  # Converts delta temporality (sent by the app) into cumulative temporality
  # expected by the Prometheus exporter. This prevents the "Misaligned starting
  # timestamps" warning that caused custom counters to be dropped intermittently.
  # max_stale: how long to retain a series with no incoming deltas before evicting it.
  # Set to 1h so infrequent metrics (e.g. payment counter between checkouts) are not
  # prematurely evicted and then re-created with a new epoch (which would trigger the
  # Misaligned warning again on the next checkout).
  deltatocumulative:
    max_stale: 1h

exporters:
  # Traces → Jaeger via OTLP
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true

  # Metrics → exposed on :8889 for Prometheus to scrape
  # enable_open_metrics: allows Prometheus to consume counter resets correctly
  # when the app restarts (avoids "Misaligned starting timestamps" drops).
  # metric_expiration: how long to keep exposing a metric at :8889/metrics after
  # the last update. 1h matches max_stale above so both caches evict together;
  # Prometheus therefore sees continuous data for 1 h after the last checkout.
  prometheus:
    endpoint: "0.0.0.0:8889"
    namespace: nopcommerce
    enable_open_metrics: true
    metric_expiration: 1h

  # Debug exporter — logs a summary to collector stdout (useful during dev)
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [resourcedetection, transform/sanitize_pii, batch]
      exporters: [otlp/jaeger, debug]

    metrics:
      receivers: [otlp]
      processors: [resourcedetection, deltatocumulative, batch]
      exporters: [prometheus, debug]
